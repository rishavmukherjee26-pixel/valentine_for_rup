
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rupanjana ❤️</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(180deg,#ff758c,#ff7eb3)
}
.card{
  width:92%;max-width:380px;background:#fff;border-radius:25px;
  padding:22px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.25)
}
.hero{
  height:220px;border-radius:18px;margin-bottom:12px;
  background:
    radial-gradient(circle at 30% 30%, #ffd1dc 0 20%, transparent 21%),
    radial-gradient(circle at 70% 40%, #ffd1dc 0 18%, transparent 19%),
    linear-gradient(135deg,#ff9a9e,#fecfef);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:54px
}
h1{color:#ff4d6d;margin:10px 0;font-size:26px}
p{color:#555;font-size:16px;line-height:1.45}
.buttons{margin-top:22px;position:relative;height:55px}
button{
  width:130px;padding:12px;border:0;border-radius:30px;font-size:16px
}
#yes{background:#ff4d6d;color:#fff}
#no{background:#eee;position:absolute;right:0}
@media (min-width:768px){
  body::before{content:"📱 Please open this on your phone 💖";color:#fff;font-size:22px}
  .card{display:none}
}
</style>
</head>
<body>
<div class="card">
  <div class="hero">❤️</div>
  <h1>Rupanjana ❤️</h1>
  <p>From the moment you came into my life,<br>everything felt warmer and brighter.</p>
  <p><strong>Will you be my Valentine?</strong></p>
  <div class="buttons">
    <button id="yes" onclick="yesClicked()">Yes 💖</button>
    <button id="no" ontouchstart="moveNo()">No 🙈</button>
  </div>
</div>
<script>
function yesClicked(){
  document.body.innerHTML = `
  <div style="height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#ff758c,#ff7eb3);color:#fff;text-align:center;padding:30px">
    <div>
      <h1 style="font-size:32px">YAYYYY 💕</h1>
      <p style="font-size:20px;line-height:1.5">
        Rupanjana,<br>you just made my heart skip a beat ❤️<br><br>
        Happy Valentine’s Day 💐
      </p>
    </div>
  </div>`
}
function moveNo(){
  const b=document.getElementById('no');
  const x=Math.random()*140-70, y=Math.random()*80-40;
  b.style.transform=`translate(${x}px,${y}px)`
}
</script>
</body>
</html>
